<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feliz Aniversario ❤️</title>
<style>

body{
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding-top: 100px;
}

h1{
    color: #ff4da6;
    font-size: 50px;
    text-shadow: 3px 3px 8px #ff1493;
}

p{
    font-size: 22px;
}

button{
    background: #ff1493;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 20px;
    border-radius: 15px;
    cursor: pointer;
}

button:hover{
    background: #ff4da6;
}

.corazon{
    font-size: 60px;
}

</style>

<script>

function mostrarCarta(){

    alert(
"💖 PARA MI AMOR 💖\n\n" +
"Gracias por cada momento que hemos compartido.\n\n" +
"Por tus sonrisas,\n" +
"por tu cariño,\n" +
"por tu compañía.\n\n" +
"Eres una persona muy especial para mí.\n\n" +
"Te amo muchísimo ❤️\n\n" +
"🌹 Feliz Aniversario 🌹"
    );

}

</script>

</head>

<body>

<div class="corazon">❤️</div>

<h1>Feliz Aniversario Mi Amor</h1>

<p>
Esta sorpresa fue creada especialmente para ti 💖
</p>

<button onclick="mostrarCarta()">
Abrir Carta 💌
</button>

</body>
</html>
